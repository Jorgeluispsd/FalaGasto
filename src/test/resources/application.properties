spring.application.name=demo
spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.8
spring.ai.openai.audio.transcription.model=whisper-1

#Deixar com valor 0 a temperatura faz com que ele não crie nada e nem varie
spring.ai.openai.audio.transcription.temperature=0.2
spring.ai.openai.audio.transcription.language=pt
spring.ai.openai.audio.transcription.response-format=text
spring.ai.openai.audio.transcription.prompt=Áudio em português brasileiro. \
  Áudio contém descrição de gasto financeiros. \
  As frases geralmente contêm: \
  - um valor em reais (número + "reais"); \
  - uma ação (gastei, comprei, andei, paguei); \
  - uma descrição do gasto \
  - um local ou estabelecimento (compra online, mercado (carrefour no exemplo), lanchonete, ônibus, ect.).

spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.speech.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.voice=nova
spring.ai.openai.audio.speech.speed=1.2
spring.ai.openai.audio.speech.response-format=mp3


logging.level.org.springframework.ai=DEBUG


